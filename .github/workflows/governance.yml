name: governance

on:
  pull_request:
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate MAJO-000 foundation
        run: python3 tools/validate_foundation.py

      - name: Check whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
            exit 0
          fi

          # For push events, compare exactly what the push introduced.
          # A new branch may report an all-zero "before" SHA, so fall back
          # to the current commit's first parent when available.
          if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] &&              git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            git diff --check "$EVENT_BEFORE" HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --root HEAD
          fi
