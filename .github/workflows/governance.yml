name: governance

on:
  pull_request:
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate MAJO-000 foundation
        run: python3 tools/validate_foundation.py

      - name: Check whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
            exit 0
          fi

          if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] &&
             git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            git diff --check "$EVENT_BEFORE" HEAD
            exit 0
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
            BASE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
            git diff --check "$BASE_SHA" HEAD
            exit 0
          fi

          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          git diff --check "$EMPTY_TREE" HEAD

  core-tests:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run pure core tests
        run: dotnet run --project tests/MajoServerModpack.Core.Tests/MajoServerModpack.Core.Tests.csproj -c Release

  runtime-build:
    needs: core-tests
    runs-on: ubuntu-latest
    env:
      BEPINEX_SHA256: e538560be65739f562519ab518a75f9c65b3f57f87457403ae7cde683c12dab7
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare build paths
        run: |
          echo "VALHEIM_DIR=$RUNNER_TEMP/valheim-server" >> "$GITHUB_ENV"
          echo "STEAMCMD_DIR=$RUNNER_TEMP/steamcmd" >> "$GITHUB_ENV"
          echo "BEPINEX_ROOT=$RUNNER_TEMP/bepinex" >> "$GITHUB_ENV"

      - name: Install SteamCMD prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 unzip

      - name: Install SteamCMD
        run: |
          set -euo pipefail
          mkdir -p "$STEAMCMD_DIR"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz             | tar -xz -C "$STEAMCMD_DIR"

      - name: Install Valheim Dedicated Server build input
        run: |
          set -euo pipefail
          mkdir -p "$VALHEIM_DIR"
          for attempt in 1 2 3; do
            if "$STEAMCMD_DIR/steamcmd.sh" \
              +force_install_dir "$VALHEIM_DIR" \
              +login anonymous \
              +app_update 896660 validate \
              +quit; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "SteamCMD failed to install Valheim Dedicated Server after 3 attempts." >&2
              exit 1
            fi

            sleep "$((attempt * 5))"
          done

          test -d "$VALHEIM_DIR/valheim_server_Data/Managed"

      - name: Install pinned BepInEx build input
        run: |
          set -euo pipefail
          mkdir -p "$BEPINEX_ROOT"
          curl -fsSL             -o "$RUNNER_TEMP/bepinex.zip"             https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_linux_x64_5.4.23.5.zip
          echo "$BEPINEX_SHA256  $RUNNER_TEMP/bepinex.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$BEPINEX_ROOT"
          test -f "$BEPINEX_ROOT/BepInEx/core/BepInEx.dll"

      - name: Build Majo runtime
        run: |
          set -euo pipefail
          dotnet build src/MajoServerModpack/MajoServerModpack.csproj             -c Release             -p:ExecutePrebuild=true             -p:VALHEIM_INSTALL="$VALHEIM_DIR"             -p:BEPINEX_PATH="$BEPINEX_ROOT/BepInEx"             -p:VALHEIM_MANAGED="$VALHEIM_DIR/valheim_server_Data/Managed"

      - name: Validate Majo artifact
        run: |
          set -euo pipefail
          OUT="src/MajoServerModpack/bin/Release/net462"
          test -f "$OUT/MajoServerModpack.dll"
          rm -rf artifacts
          mkdir -p artifacts
          cp "$OUT/MajoServerModpack.dll" artifacts/
          test "$(find artifacts -maxdepth 1 -type f -name '*.dll' | wc -l)" -eq 1
          test "$(basename "$(find artifacts -maxdepth 1 -type f -name '*.dll')")" = "MajoServerModpack.dll"
